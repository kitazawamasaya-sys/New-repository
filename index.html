<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#000000">

    <title>新聞配達</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- インデックス（ブロック一覧） -->
    <main class="app" id="index-view">

        <h1>新聞配達</h1>

        <section class="block-section">

            <table>
                <thead>
                    <tr>
                        <th>ブロック</th>
                        <th id="newspaper1-header">新聞①</th>
                        <th id="newspaper2-header">新聞②</th>
                    </tr>
                </thead>

                <tbody id="block-list">
                </tbody>
            </table>

        </section>

        <button id="start-button">
            開始
        </button>

    </main>

    <!-- ブロック画面（中身はapp.jsが作る） -->
    <main class="app" id="block-view" hidden>
    </main>

    <script src="app.js"></script>

</body>
</html>
