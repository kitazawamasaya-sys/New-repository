<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>新聞配達</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header>
            <span id="time">03:42</span>
            <span id="progress">0 / 0</span>
        </header>

        <section class="current">

            <div class="label">次の配達先</div>

            <div id="name" class="name">
                読み込み中
            </div>

            <div id="items" class="items"></div>

            <button id="complete">
                投函完了 ✓
            </button>

        </section>

        <section class="next">

            <div class="label">次の5件</div>

            <div id="nextList"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
